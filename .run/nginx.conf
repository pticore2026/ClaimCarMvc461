daemon off;
pid /tmp/claimcar-nginx.pid;
error_log /tmp/claimcar-nginx-error.log info;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    access_log /tmp/claimcar-nginx-access.log;
    client_body_temp_path /tmp/claimcar-nginx-client;
    proxy_temp_path /tmp/claimcar-nginx-proxy;
    fastcgi_temp_path /tmp/claimcar-nginx-fastcgi;
    uwsgi_temp_path /tmp/claimcar-nginx-uwsgi;
    scgi_temp_path /tmp/claimcar-nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /workspaces/ClaimCarMvc461/ClaimCar.Web;

        location /Content/ {
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
}
